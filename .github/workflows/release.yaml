name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: release

    runs-on: ubuntu-24.04-arm
    environment: publishing

    env:
      VITE_PRESERVE_MODULES: "false"

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v7

      - name: Check if package version matches
        run: test "${GITHUB_REF_NAME}" = "v$(yq -r .version package.json)"

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Setup pnpm
        run: corepack enable

      - name: Get pnpm cache directory
        shell: bash
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> ${GITHUB_ENV}

      - name: Use pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.pnpm_cache_dir }}
          key: ubuntu-24.04-arm-node-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ubuntu-24.04-arm-node-

      - name: Install pnpm dependencies
        id: install-pnpm
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile
        continue-on-error: true

      - name: Install pnpm dependencies (retry)
        if: steps.install-pnpm.outcome == 'failure'
        run: timeout 300 pnpm install --color=always --prefer-offline --frozen-lockfile

      - name: Build packages
        id: build-packages
        run: pnpm --color=always --stream build
        continue-on-error: true

      - name: Build packages (retry)
        id: build-packages-2
        if: steps.build-packages.outcome == 'failure'
        run: pnpm --color=always --stream build
        continue-on-error: true

      - name: Build packages (retry 2)
        if: steps.build-packages-2.outcome == 'failure'
        run: pnpm --color=always --stream build

      - name: Pack packages
        run: pnpm --color=always --stream pack

      - name: Publish npm packages
        id: publish-npm
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) dist_tag=next;;
            *) dist_tag=latest;;
          esac
          if [[ -n ${NPM_TOKEN:-} ]]; then
            NODE_AUTH_TOKEN="${NPM_TOKEN}" pnpm --color=always publish -r \
              --no-git-checks \
              --tag ${dist_tag}
          else
            NPM_CONFIG_PROVENANCE=true pnpm --color=always publish -r \
              --no-git-checks \
              --tag ${dist_tag}
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      - name: Publish npm packages (retry)
        id: publish-npm-2
        if: steps.publish-npm.outcome == 'failure'
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) dist_tag=next;;
            *) dist_tag=latest;;
          esac
          if [[ -n ${NPM_TOKEN:-} ]]; then
            NODE_AUTH_TOKEN="${NPM_TOKEN}" pnpm --color=always publish -r \
              --no-git-checks \
              --tag ${dist_tag}
          else
            NPM_CONFIG_PROVENANCE=true pnpm --color=always publish -r \
              --no-git-checks \
              --tag ${dist_tag}
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      - name: Publish npm packages (retry 2)
        if: steps.publish-npm-2.outcome == 'failure'
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) dist_tag=next;;
            *) dist_tag=latest;;
          esac
          if [[ -n ${NPM_TOKEN:-} ]]; then
            NODE_AUTH_TOKEN="${NPM_TOKEN}" pnpm --color=always publish -r \
              --no-git-checks \
              --tag ${dist_tag}
          else
            NPM_CONFIG_PROVENANCE=true pnpm --color=always publish -r \
              --no-git-checks \
              --tag ${dist_tag}
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          upload-release-assets: false

      - name: Normalize SBOM filename
        shell: bash
        run: |
          for f in *.tgz; do
            mv sbom.spdx.json "${f%.tgz}-spdx.json"
          done

      # The production build (build/prod-packages.js) writes prod-packages.json:
      # the npm packages actually bundled into out/, mapped to their pnpm-store
      # path. release-scan.yaml downloads it to reduce the SBOM to what ships
      # before scanning. Renamed to travel next to the SBOM as a release asset.
      - name: Normalize runtime package list filename
        shell: bash
        run: |
          test -f prod-packages.json
          for f in *.tgz; do
            mv prod-packages.json "${f%.tgz}-prod-packages.json"
          done

      - name: Make checksums
        shell: bash
        run: |
          for f in *.tgz *-spdx.json *-prod-packages.json; do
            sha256sum "$f" | tee "$f.sha256"
          done

      # Attest that these exact bytes were built by this workflow from this
      # commit, so `gh attestation verify <file> --repo <owner>/<repo>` succeeds
      # for every release asset. The .sha256 files are already in sha256sum
      # format (one "<digest>  <name>" line each), which is what
      # subject-checksums expects; the name is the release asset name it matches.
      - name: Collect attestation subjects
        shell: bash
        run: |
          cat *.sha256 | sort -u > attestation-checksums.txt
          cat attestation-checksums.txt
          test -s attestation-checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: attestation-checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |-
            *.tgz
            *.tgz.sha256
            *-spdx.json
            *-spdx.json.sha256
            *-prod-packages.json
            *-prod-packages.json.sha256
