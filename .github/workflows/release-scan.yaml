name: Release Scan

# Scans what the last release actually shipped, from the SBOM and runtime
# package list published with it. Its counterpart is main-scan.yaml, which runs
# the same filter and table over what the main branch currently builds - same
# report, different subject. The result is posted to discussion #41.
#
# This never builds anything: the release assets are the manifest of what users
# downloaded, so they are the only input. The working tree is checked out for
# mise.toml and mise.lock and nothing else.

on:
  schedule:
    - cron: 38 21 * * *
  workflow_dispatch: {}
  # Refreshes the report as soon as a release is published. workflow_run rather
  # than the release event, because waiting for the whole Release run guarantees
  # the assets are uploaded and the release is no longer a draft. A separate
  # workflow (not a job in Release, not workflow_call) keeps a scan failure -
  # e.g. an advisory feed being down - from marking an otherwise correct release
  # as failed.
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: release-scan
  cancel-in-progress: true

jobs:
  scan:
    name: scan the last release

    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-24.04-arm

    # Carries the GH_TOKEN secret (a PAT) used to update the discussion: the
    # default GITHUB_TOKEN cannot write discussions in this repo even with
    # discussions: write.
    environment: automated

    permissions:
      contents: read
      discussions: write

    env:
      # Renovate keeps this in sync via the inline datasource hint (see
      # .renovaterc.json5 customManagers).
      GRYPE_VERSION: v0.116.0 # datasource=github-releases depName=anchore/grype
      DISCUSSION_NUMBER: 41
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # Only needed for mise.toml and mise.lock: every step below works on
      # release assets, not on the working tree.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.0 # datasource=github-releases depName=jdx/mise
          install_args: yq

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@v7
        with:
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: true

      - name: Download the assets of the last release
        id: release
        run: |
          set -eo pipefail
          tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_OUTPUT"
          mkdir -p sboms prod
          # `|| true`: gh exits non-zero when a pattern matches nothing, which is
          # the "release predates this" case handled below, not an error.
          gh release download "$tag" -R "$GITHUB_REPOSITORY" --pattern '*-spdx.json' --dir sboms || true
          gh release download "$tag" -R "$GITHUB_REPOSITORY" --pattern '*-prod-packages.json' --dir prod || true
          sboms=$(find sboms -name '*-spdx.json' | wc -l)
          lists=$(find prod -name '*-prod-packages.json' | wc -l)
          echo "sboms=$sboms" >> "$GITHUB_OUTPUT"
          echo "lists=$lists" >> "$GITHUB_OUTPUT"
          echo "$tag publishes $sboms SBOM(s) and $lists runtime package list(s)"

      # Releases made before these assets were published have nothing to scan.
      # Say so in the discussion instead of failing every night - the next
      # release fixes it on its own.
      - name: Report a release without the assets to scan
        if: steps.release.outputs.sboms == '0' || steps.release.outputs.lists == '0'
        run: |
          set -eo pipefail
          if [[ "${{ steps.release.outputs.sboms }}" -eq 0 ]]; then
            missing="ships no SBOM"
          else
            missing="ships an SBOM but no runtime package list, which this report needs to reduce it to what actually runs on a user's machine"
          fi
          {
            echo "The last release, [\`${{ steps.release.outputs.tag }}\`](${{ steps.release.outputs.url }}), $missing: it predates publishing them."
            echo
            echo "This report starts with the first release that publishes both. Updated $(date -u +'%Y-%m-%d %H:%M UTC') by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          } > body.md

      - name: Scan the runtime packages with Grype
        if: steps.release.outputs.sboms != '0' && steps.release.outputs.lists != '0'
        run: |
          set -eo pipefail
          grype="${{ steps.grype.outputs.cmd }}"
          # The release publishes one runtime package list (npm <name>@<version>
          # -> pnpm-store path). Merge defensively in case a future release ships
          # more than one, then refuse to scan an empty set.
          yq ea -pj -oj '. as $i ireduce ({}; . * $i)' prod/*-prod-packages.json > prod-set.json
          if [[ "$(yq -pj -oj 'length' prod-set.json)" -eq 0 ]]; then
            echo "Runtime package set is empty - refusing to scan" >&2
            exit 1
          fi
          shopt -s nullglob
          mkdir -p jsons
          for sbom in sboms/*-spdx.json; do
            name=$(basename "$sbom" .spdx.json)
            # Reduce the SBOM to runtime packages: keep only npm packages present
            # in the bundled set. This extension ships no non-npm binaries, so
            # npm is the whole runtime surface.
            yq -pj -oj '
              (load("prod-set.json")) as $set |
              .packages |= map(
                ( ((.externalRefs // []) | map(select(.referenceType == "purl")))[0].referenceLocator // "" ) as $purl |
                (.name + "@" + (.versionInfo // "")) as $key |
                select(($purl | test("^pkg:npm/")) and ($set[$key] != null))
              )
            ' "$sbom" > "runtime-${name}.spdx.json"
            all=$(yq -pj -oj '.packages | length' "$sbom")
            run=$(yq -pj -oj '.packages | length' "runtime-${name}.spdx.json")
            echo "::group::grype ${sbom} (${all} -> ${run} runtime packages)"
            "$grype" "sbom:runtime-${name}.spdx.json" -o json="jsons/${name}.json"
            echo "::endgroup::"
          done
          # Merge the per-SBOM reports (one, unless a future release ships more):
          # dedupe by vulnerability + package + version, and resolve each match's
          # location from its <name>@<version> - the pnpm-store path, or a
          # synthetic fallback so a row never renders a blank location.
          yq ea -pj -oj -I0 '[.]' jsons/*.json |
            yq -pj -oj '
                (load("prod-set.json")) as $set |
                . as $x |
                {
                  "matches": (
                    [$x[].matches[]]
                    | unique_by(.vulnerability.id + "@" + .artifact.name + "@" + .artifact.version)
                    | map(
                        (.artifact.name + "@" + .artifact.version) as $key
                        | .artifact.locations = [{"path": ($set[$key] // ("sbom/" + $key))}]
                      )
                  )
                }
              ' > grype.json

      - name: Build the vulnerability table
        if: steps.release.outputs.sboms != '0' && steps.release.outputs.lists != '0'
        run: |
          set -eo pipefail
          # Same shape as the main-branch report in main-scan.yaml. negrisk is a
          # sort-only helper: yq has no unary minus, so descending-by-risk needs
          # the value pre-negated.
          yq -pj -oj '
            ({"Critical":0,"High":1,"Medium":2,"Low":3,"Negligible":4,"Unknown":5}) as $rank
            | (.matches // [])
            | map(
                {
                  "severity": .vulnerability.severity,
                  "risk": (.vulnerability.risk // 0),
                  "package": .artifact.name,
                  "type": .artifact.type,
                  "installed": .artifact.version,
                  "fixed": ((.vulnerability.fix.versions // []) | join(", ")),
                  "advisory": ("[" + .vulnerability.id + "](" + (.vulnerability.dataSource // "") + ")"),
                  "location": (.artifact.locations[0].path // ""),
                  "rank": ($rank[.vulnerability.severity] // 9),
                  "negrisk": (0 - (.vulnerability.risk // 0))
                }
              )
            | sort_by(.rank, .negrisk, .package)
            | map(del(.rank) | del(.negrisk))
          ' grype.json > rows.json
          count=$(yq -pj -oj 'length' rows.json)
          {
            echo "Grype runtime vulnerability scan of the artifacts published with [\`${{ steps.release.outputs.tag }}\`](${{ steps.release.outputs.url }}), scanned from the SBOM shipped with the release. Updated $(date -u +'%Y-%m-%d %H:%M UTC') by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            if [[ "$count" -eq 0 ]]; then
              echo "No runtime vulnerabilities found."
            else
              echo "| Severity | Risk | Package | Type | Installed | Fixed In | Advisory | Location |"
              echo "| --- | --- | --- | --- | --- | --- | --- | --- |"
              # LC_ALL=C: printf "%.1f" must use a period regardless of the
              # runner's locale, or it silently truncates "6.6" to "6" and
              # re-renders it as "6,0".
              yq -pj -ot rows.json | tail -n +2 |
                LC_ALL=C awk -F'\t' '{printf "| %s | %.1f | %s | %s | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5, $6, $7, $8}'
            fi
          } > body.md
          echo "runtime vulnerabilities: $count"

      - name: Update discussion
        env:
          # PAT from the automated environment; the default GITHUB_TOKEN is
          # forbidden from updateDiscussion in this repo.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |-
          set -eo pipefail
          discussion_id=$(gh api graphql -f query='
            query($owner:String!,$repo:String!,$num:Int!){
              repository(owner:$owner,name:$repo){
                discussion(number:$num){ id }
              }
            }' -f owner="${{ github.repository_owner }}" -f repo="${{ github.event.repository.name }}" -F num="$DISCUSSION_NUMBER" \
            --jq '.data.repository.discussion.id')
          if [[ -z "$discussion_id" || "$discussion_id" == "null" ]]; then
            echo "Discussion #$DISCUSSION_NUMBER not found" >&2
            exit 1
          fi
          gh api graphql -f query='
            mutation($id:ID!,$body:String!){
              updateDiscussion(input:{discussionId:$id, body:$body}){
                discussion{ id }
              }
            }' -f id="$discussion_id" -F body=@body.md
